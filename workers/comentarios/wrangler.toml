name = "bmb-comentarios"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Origem autorizada a chamar a API. Deixe o domínio final aqui antes de publicar
# — com "*" qualquer site pode postar comentário no seu banco.
[vars]
ORIGEM_PERMITIDA = "https://bemmaisbella.com.br"

# Banco D1. Crie com:
#   npx wrangler d1 create bmb-comentarios
# e cole o database_id que o comando devolver.
[[d1_databases]]
binding = "DB"
database_name = "bmb-comentarios"
database_id = "[COLE_O_DATABASE_ID_AQUI]"

# Segredos — NÃO ficam neste arquivo. Defina por linha de comando:
#   npx wrangler secret put TOKEN_MODERACAO
#   npx wrangler secret put SAL_IP
#   npx wrangler secret put TURNSTILE_SECRET   (opcional)
